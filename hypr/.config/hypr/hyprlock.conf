# ~/.config/hypr/hyprlock.conf
# Nord theme only — clean, frosty, minimal

$font = "JetBrainsMono Nerd Font"

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.85
    vibrancy = 0.15
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    rounding = 12
    inner_color = rgba(46, 52, 64, 0.6)     # Nord dark
    outer_color = rgba(76, 86, 106, 0.9)    # Nord medium
    check_color = rgba(136, 192, 208, 0.9)  # Nord frost
    fail_color = rgba(191, 97, 106, 0.9)    # Nord red

    font_color = rgba(216, 222, 233, 0.85)  # Nord snow
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center

    font_family = $font
}

# --- Username badge ---
label {
    monitor =
    text =    $USER
    font_size = 20
    font_family = $font
    text_color = rgba(236, 239, 244, 0.8)      # Nord snow
    background_color = rgba(46, 52, 64, 0.8)   # Nord dark
    padding = 8
    rounding = 8
    position = 0, 120
    halign = center
    valign = center
}

# --- Time ---
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    text_color = rgba(216, 222, 233, 0.95)  # Nord snow

    position = -30, 0
    halign = right
    valign = top
}

# --- Date ---
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    text_color = rgba(216, 222, 233, 0.7)  # muted snow

    position = -30, -150
    halign = right
    valign = top
}

# --- Layout switcher (optional) ---
label {
    monitor =
    text = $LAYOUT[en,ru]
    font_size = 24
    font_family = $font
    text_color = rgba(216, 222, 233, 0.7)
    onclick = hyprctl switchxkblayout all next

    position = 250, -20
    halign = center
    valign = center
}
